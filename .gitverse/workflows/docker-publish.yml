# GitVerse CI/CD workflow
# Собирает Docker-образы backend и frontend и публикует их в Container Registry GitVerse.
# Секреты в настройках репозитория: Settings -> Repository -> Secrets
#   GITVERSE_USERNAME - имя пользователя GitVerse (для docker login)
#   GITVERSE_TOKEN    - токен доступа GitVerse (профиль -> Управление токенами), с правами на пакеты
#   GITVERSE_OWNER    - владелец репозитория (например, ваш логин на gitverse.ru)

name: Docker build and push

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Kaniko credentials for GitVerse registry
        run: |
          mkdir -p "${{ gitverse.workspace }}/.docker"
          AUTH=$(echo -n "${{ secrets.GITVERSE_USERNAME }}:${{ secrets.GITVERSE_TOKEN }}" | base64 -w0)
          cat > "${{ gitverse.workspace }}/.docker/config.json" <<EOF
          {
            "auths": {
              "gitverse.ru": {
                "auth": "${AUTH}"
              }
            }
          }
          EOF
          chmod 600 "${{ gitverse.workspace }}/.docker/config.json"
        shell: bash

      # --- Backend image ---
      - name: Kaniko build and push backend
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ gitverse.workspace }}/.docker
        with:
          args: >-
            --context=dir://${{ gitverse.workspace }}
            --dockerfile=Dockerfile
            --destination=gitverse.ru/${{ secrets.GITVERSE_USERNAME }}/scheduler-backend:latest
            --verbosity=info

      # --- Frontend image ---
      - name: Kaniko build and push frontend
        uses: docker://gcr.io/kaniko-project/executor:v1.24.0
        env:
          DOCKER_CONFIG: ${{ gitverse.workspace }}/.docker
        with:
          args: >-
            --context=dir://${{ gitverse.workspace }}/web
            --dockerfile=Dockerfile
            --destination=gitverse.ru/${{ secrets.GITVERSE_USERNAME }}/scheduler-web:latest
            --verbosity=info

  deploy-pages:
    name: Deploy frontend to GitVerse Pages
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Upload pages artifact
        uses: gitverse/upload-pages-artifact@v1.0.0
        with:
          path: web/dist

      - name: Deploy to GitVerse Pages
        uses: gitverse/deploy-pages@v1.0.0
